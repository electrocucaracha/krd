name: Lint Code Base
# yamllint disable-line rule:truthy
on:
  push:
  pull_request:
jobs:
  get-sloc:
    name: Count Lines of Code
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # 6.0.3
        with:
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # 7.0.0
        with:
          go-version: ">=1.20.0"
      - name: Install dependencies
        run: go install github.com/boyter/scc/v3@latest
      - name: Run scc tool
        run: scc --format wide
  check-broken-links:
    name: Check documentation external links
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # 6.0.3
        with:
          persist-credentials: false
      - name: Check broken links
        uses: tcort/github-action-markdown-link-check@e047c5b37f24ab722bbef1a27b6fab7f96bc4068 # 1.1.3
  check-super-linter:
    name: Check syntax (super-linter)
    permissions:
      contents: read
      models: read
      issues: write
    uses: electrocucaracha/gh-workflows/.github/workflows/linter.yml@7362342ec4b465d80999556fae6bb61b3e56f010 # v7.0.8
    with:
      validate_overrides: |-
        {
          "VALIDATE_JSCPD": false,
          "VALIDATE_SHELL_SHFMT": false,
          "VALIDATE_CHECKOV": false,
          "VALIDATE_BIOME_LINT": false,
          "VALIDATE_BIOME_FORMAT": false,
          "VALIDATE_ENV": false,
          "VALIDATE_PYTHON_RUFF_FORMAT": false
        }
    secrets:
      COPILOT_TOKEN: ${{ secrets.COPILOT_TOKEN }}
  check-tox:
    name: Check syntax (tox)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # 6.0.3
        with:
          persist-credentials: false
      - name: Install tox
        run: pip install tox
      - name: Run tox lint validation
        run: tox -e lint
      - name: Run tox documents validation
        run: tox -e docs
