apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web-server
  template:
    metadata:
      labels:
        app: web-server
    spec:
      containers:
        - name: nginx
          image: nginx:1.29
          ports:
            - containerPort: 80
          volumeMounts:
            - name: packages
              mountPath: /var/mirrors/apt-mirror/
            - name: nginx-default
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
      volumes:
        - name: packages
          persistentVolumeClaim:
            claimName: pvc-packages
        - name: nginx-default
          configMap:
            name: nginx-default
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-default
data:
  nginx.conf: |
    user  nginx;
    worker_processes  auto;

    events {
      worker_connections  1024;
    }

    http {
      server {
        listen 80;

        location /ubuntu {
          root /var/mirrors/apt-mirror/mirror/archive.ubuntu.com/;
          autoindex on;
        }
      }
    }
---
apiVersion: v1
kind: Service
metadata:
  name: web-server
spec:
  selector:
    app: web-server
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web-server-ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web-server
                port:
                  number: 80
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: pv-packages
  labels:
    type: local
spec:
  storageClassName: local-storage
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  hostPath:
    path: "/mnt/data"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pvc-packages
spec:
  storageClassName: local-storage
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  volumeName: pv-packages
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: apt-mirror
spec:
  schedule: "0 * * * *" # Runs every hour
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: mirror
              image: ghcr.io/electrocucaracha/releng/apt-mirror:master
              command: ["/bin/sh", "-c"]
              args:
                - /usr/bin/apt-mirror && echo "Mirror sync complete"
              volumeMounts:
                - name: apt-config
                  mountPath: /etc/apt/mirror.list
                  subPath: mirror.list
                - name: packages
                  mountPath: /var/apt-mirror/packages
          volumes:
            - name: apt-config
              configMap:
                name: apt-mirror-config
            - name: packages
              persistentVolumeClaim:
                claimName: pvc-packages
                readOnly: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: apt-mirror-config
data:
  mirror.list: |
    set base_path /var/apt-mirror/packages
    set mirror_path $base_path/mirror
    set skel_path $base_path/skel
    set var_path $base_path/var
    set nthreads 50
    set limit_rate 10m
    set cleanscript /var/spool/apt-mirror/var/clean.sh
    set postmirror_script /var/spool/apt-mirror/var/postmirror.sh

    # Ubuntu 22.04 LTS (amd64, i386)
    deb http://archive.ubuntu.com/ubuntu jammy main restricted universe multiverse

    clean http://archive.ubuntu.com/ubuntu
